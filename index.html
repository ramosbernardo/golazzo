<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Golazzo — Finta, finta, gol</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#14121A"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@1,900&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#07060D;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100vw;height:100vh;height:100dvh}
#nameIn{position:fixed;display:none;z-index:5;border:3px solid #FF3D7F;border-radius:14px;background:#14121A;color:#fff;text-align:center;font:800 20px 'Inter',sans-serif;text-transform:uppercase;outline:none;box-sizing:border-box;padding:0 10px}
#saveIn{position:fixed;display:none;z-index:5;border:2px solid #FF3D7F;border-radius:12px;background:#14121A;color:#fff;font:600 12px monospace;padding:8px;box-sizing:border-box;resize:none;word-break:break-all}
#codeIn{position:fixed;display:none;z-index:5;border:3px solid #FF3D7F;border-radius:14px;background:#14121A;color:#fff;text-align:center;letter-spacing:.3em;font:900 italic 40px 'Inter Tight','Arial Black',sans-serif;text-transform:uppercase;outline:none;box-sizing:border-box}
</style></head><body><canvas id="c"></canvas><textarea id="saveIn" spellcheck="false" autocomplete="off"></textarea><input id="nameIn" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="SEU NOME"><input id="codeIn" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD">
<script>
// ===== setup =====
const ACC='#FF3D7F', INK='#14121A';
const DISP='italic 900 {S}px "Inter Tight", "Arial Black", sans-serif', UI='800 {S}px "Inter", system-ui, sans-serif', UI6='600 {S}px "Inter", system-ui, sans-serif';
const F=(tpl,s)=>tpl.replace('{S}',Math.max(1,Math.round(s)));
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR,FOC,HOR,PORTRAIT;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  PORTRAIT=H>W;FOC=PORTRAIT?W*1.05:Math.min(W*0.75,H*1.25);HOR=H*(PORTRAIT?0.36:0.2);}
addEventListener('resize',resize);resize();

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,u)=>a+(b-a)*u;
const sstep=u=>{u=clamp(u,0,1);return u*u*(3-2*u)}, eOut=u=>1-Math.pow(1-clamp(u,0,1),3);
const back=u=>{u=clamp(u,0,1);const c=1.9;return 1+(c+1)*Math.pow(u-1,3)+c*Math.pow(u-1,2)};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const SAVE=(()=>{let s=null;try{s=JSON.parse(store.get('golazzo_save')||'null')}catch(e){}
  const d={coins:0,boots:['rosa'],balls:['classica'],celebs:[],glasses:['none'],hats:['none'],jackets:['none'],ultis:['cruzado','elastico','chapeu','caneta','roleta'],set:{music:true,sfx:true,vib:true,edit:true,replay:true},chestDate:'',tutDone:false,season:1,equip:{boots:'rosa',ball:'classica',glasses:'none',hat:'none',jacket:'none',ultis:['cruzado','drible']},secret:false,cups:{},penBest:{},daily:null};
  s=Object.assign(d,s||{});s.equip=Object.assign({boots:'rosa',ball:'classica',glasses:'none',hat:'none',jacket:'none',ultis:['cruzado','elastico']},s.equip||{});
  s.set=Object.assign({music:true,sfx:true,vib:true,edit:true,replay:true},s.set||{});
  for(const k of['cruzado','elastico','chapeu','caneta','roleta'])if(!s.ultis.includes(k))s.ultis.push(k);s.ultis=s.ultis.filter(k=>k!=='drible');s.equip.ultis=(s.equip.ultis||[]).map(k=>k==='drible'?'elastico':k);return s})();
function saveGame(){store.set('golazzo_save',JSON.stringify(SAVE))}

// ===== audio (synth, starts on first tap) =====
let AC=null,crowdGain=null;
function audioInit(){if(AC)return;unlockSpeech();try{AC=new (window.AudioContext||window.webkitAudioContext)();
  const n=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const src=AC.createBufferSource();src.buffer=n;src.loop=true;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=700;
  crowdGain=AC.createGain();crowdGain.gain.value=0.05;src.connect(f).connect(crowdGain).connect(AC.destination);src.start();}catch(e){AC=null}try{musicStart()}catch(e){}}
function noiseBurst(dur,f0,f1,g,type='bandpass'){if(!AC||!SAVE.set.sfx)return;const t=AC.currentTime,n=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const s=AC.createBufferSource();s.buffer=n;const f=AC.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const a=AC.createGain();a.gain.setValueAtTime(g,t);a.gain.exponentialRampToValueAtTime(0.001,t+dur);s.connect(f).connect(a).connect(AC.destination);s.start()}
function tone(f0,f1,dur,g,type='sine'){if(!AC||!SAVE.set.sfx)return;const t=AC.currentTime,o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const a=AC.createGain();a.gain.setValueAtTime(g,t);a.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(a).connect(AC.destination);o.start();o.stop(t+dur)}
let VOICE=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();VOICE=vs.find(v=>/^it/i.test(v.lang))||vs.find(v=>/^pt/i.test(v.lang))||vs[0]||null}catch(e){}}
try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}catch(e){}
function narrate(txt,lang){if(!SAVE.set.sfx)return;try{const u=new SpeechSynthesisUtterance(txt);if(!VOICE)pickVoice();let v=VOICE;if(lang==='pt'){try{v=speechSynthesis.getVoices().find(x=>/^pt/i.test(x.lang))||VOICE}catch(e){}}if(v){u.voice=v;u.lang=v.lang}else u.lang=lang==='pt'?'pt-BR':'it-IT';u.rate=0.85;u.pitch=0.7;u.volume=1;speechSynthesis.speak(u)}catch(e){}}
function unlockSpeech(){try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}}
const SFX={
  kick(){tone(140,45,0.25,0.7);noiseBurst(0.05,3000,800,0.2);vib(15)},
  whoosh(){noiseBurst(0.3,600,5000,0.35)},
  boing(){tone(180,560,0.35,0.35,'triangle')},
  pop(){tone(400,1500,0.12,0.3,'square')},
  tackle(){tone(200,60,0.3,0.5,'sawtooth');noiseBurst(0.2,1500,300,0.3);vib(60)},
  whistle(){tone(2600,2500,0.5,0.15,'sine')},
  goal(){vib([30,40,90]);if(!AC||!SAVE.set.sfx)return;try{
    const t0=AC.currentTime+0.03, e=60/140/2, x=e/2; // 8ths and 16ths @140bpm
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=5;const out=AC.createGain();out.gain.value=0.95;comp.connect(out).connect(AC.destination);
    const curve=new Float32Array(1024);for(let i=0;i<1024;i++){const v=i/512-1;curve[i]=Math.tanh(v*3)}
    const mf=m=>440*Math.pow(2,(m-69)/12);
    // 808 with glide to next note
    const b808=(t,m,len,glideTo)=>{const o=AC.createOscillator(),g=AC.createGain(),d=AC.createWaveShaper();d.curve=curve;o.type='sine';
      o.frequency.setValueAtTime(mf(m)*2.2,t);o.frequency.exponentialRampToValueAtTime(mf(m),t+0.05);
      if(glideTo!==undefined){o.frequency.setValueAtTime(mf(m),t+len*0.6);o.frequency.exponentialRampToValueAtTime(mf(glideTo),t+len*0.95)}
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.8,t+0.006);g.gain.setValueAtTime(0.7,t+len*0.7);g.gain.exponentialRampToValueAtTime(0.0001,t+len);
      o.connect(d).connect(g).connect(comp);o.start(t);o.stop(t+len+0.05)};
    const noise=(t,len,type,f,v,q=0.8)=>{const n=AC.createBuffer(1,Math.ceil(AC.sampleRate*len),AC.sampleRate),dd=n.getChannelData(0);for(let i=0;i<dd.length;i++)dd[i]=Math.random()*2-1;
      const s=AC.createBufferSource();s.buffer=n;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+len);s.connect(fl).connect(g).connect(comp);s.start(t)};
    const clap=t=>{for(const k of[0,0.011,0.022])noise(t+k,0.18,'bandpass',1500,0.45,1.5)};
    const hat=(t,v)=>noise(t,0.035,'highpass',9000,v);
    const kick=t=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+0.12);g.gain.setValueAtTime(0.9,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.3);o.connect(g).connect(comp);o.start(t);o.stop(t+0.32)};
    const bell=(t,m,v=0.12)=>{for(const [r,w] of[[1,'triangle'],[2.01,'sine']]){const o=AC.createOscillator(),g=AC.createGain();o.type=w;o.frequency.value=mf(m)*r;g.gain.setValueAtTime(v*(r>1?0.5:1),t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.6);o.connect(g).connect(comp);o.start(t);o.stop(t+0.62)}};
    // impact + riser-down
    kick(t0);noise(t0,1.1,'lowpass',5000,0.35);
    // 2 bars, D minor-ish
    const bassSeq=[[0,38,3*e,41],[3,41,3*e],[6,38,2*e],[8,36,3*e,38],[11,38,3*e],[14,33,2*e,38]];
    bassSeq.forEach(([i,m,len,g])=>b808(t0+i*e,m,len,g));
    [0,7,8,10].forEach(i=>kick(t0+i*e));
    [4,12].forEach(i=>clap(t0+i*e));
    for(let i=0;i<32;i++){const t=t0+i*x;hat(t,i%2?0.05:0.09);if(i===14||i===30){hat(t+x/3,0.06);hat(t+2*x/3,0.07)}}
    const mel=[74,null,77,null,76,74,null,72, 74,null,77,79,null,77,76,null];
    mel.forEach((m,i)=>{if(m)bell(t0+i*e,m)});
    if(crowdGain){const t=AC.currentTime;crowdGain.gain.setValueAtTime(0.25,t);crowdGain.gain.exponentialRampToValueAtTime(0.05,t+3.5)}
  }catch(err){}
  narrate('Golaaaaaaço!','pt');setTimeout(()=>narrate(CH().name.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase())+'!'),1700)},
  ulti(){tone(200,1600,0.6,0.25,'sawtooth');noiseBurst(0.7,400,8000,0.3)},
  miss(){tone(330,110,0.6,0.3,'triangle')},
  coin(){tone(988,988,0.08,0.18,'square');setTimeout(()=>tone(1319,1319,0.14,0.18,'square'),80)}
};

// ===== projection =====
let CAM={x:0,y:44,h:4.4,sx:0,sy:0};
function P(x,y,z=0){const d=CAM.y-y;if(d<0.35)return null;const s=FOC/d;return{x:W/2+(x-CAM.x)*s+CAM.sx,y:HOR+(CAM.h-z)*s+CAM.sy,s,d}}

// ===== environment =====
const CROWD=(()=>{const r=mulberry32(7),a=[];for(let i=0;i<1400;i++){const z=1.2+r()*15;a.push({x:-75+r()*150,z,y:-7-z*0.9,c:r(),p:r()*6.28,f:r()})}return a})();
function quad(pts,fill){const p=pts.map(q=>P(q[0],q[1],q[2]||0));if(p.some(v=>!v))return;ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)ctx.lineTo(p[i].x,p[i].y);ctx.closePath();ctx.fillStyle=fill;ctx.fill()}
const ENVS={
 noite:{name:'NOITE',sky:['#07060D','#1B1830'],stand:'#211C33',g:['#1E7A3A','#23893F'],line:'rgba(240,248,240,0.9)',crowd:['#3A3352','#4E4569','#6C6290'],board:'#0E0C16',fwd:1,grip:10,fric:0.8},
 chuva:{name:'CHUVA',sky:['#05070C','#1A2030'],stand:'#1B2030',g:['#17602E','#1A6A33'],line:'rgba(220,235,230,0.85)',crowd:['#2E3446','#3B4258','#566079'],board:'#0B0E16',fwd:1,grip:3.2,fric:0.3},
 praia:{name:'PRAIA',sky:['#3FB6EE','#BFEAFF'],stand:'#D9C08A',g:['#E6CC92','#EED7A2'],line:'rgba(255,255,255,0.95)',crowd:['#F28C8C','#FFD36E','#7FD1F7'],board:'#2B7FB8',fwd:0.93,grip:8,fric:1.5},
 neve:{name:'NEVE',sky:['#6F7A8E','#C9D1DC'],stand:'#4F5868',g:['#E4EBF2','#D6DFE9'],line:'rgba(70,100,150,0.75)',crowd:['#3D4656','#596476','#8893A6'],board:'#2E3542',fwd:0.9,grip:6,fric:1.1}};
const EV=()=>ENVS[G.env]||ENVS.noite;
function drawWorldBack(T){if(typeof HQ==='function'&&HQ())return drawWorldBackHQ(T);const E=EV();
  const g=ctx.createLinearGradient(0,0,0,H*0.6);g.addColorStop(0,E.sky[0]);g.addColorStop(1,E.sky[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(G.env==='praia'){const u=Math.min(W,H);ctx.fillStyle='rgba(255,236,150,0.35)';ctx.beginPath();ctx.arc(W*0.82,H*0.07,u*0.11,0,7);ctx.fill();ctx.fillStyle='#FFE27A';ctx.beginPath();ctx.arc(W*0.82,H*0.07,u*0.07,0,7);ctx.fill()}
  quad([[-80,-7,0],[80,-7,0],[80,-7-16*0.9,16],[-80,-7-16*0.9,16]],E.stand);
  const cheer=G.cheer;
  for(const c of CROWD){const p=P(c.x,c.y,c.z+cheer*Math.abs(Math.sin(T*9+c.p))*0.35);if(!p)continue;
    let col=c.c<0.5?E.crowd[0]:c.c<0.8?E.crowd[1]:c.c<0.93?E.crowd[2]:ACC;
    if(cheer>0.3&&((Math.floor(T*12)+Math.floor(c.f*97))%23===0))col='#fff';
    ctx.fillStyle=col;const r=Math.max(1,0.26*p.s);ctx.fillRect(p.x-r/2,p.y-r,r,r*1.3)}
  quad([[-60,-4.5,0],[60,-4.5,0],[60,-4.5,1],[-60,-4.5,1]],E.board);
  for(let i=-6;i<=6;i++){const p=P(i*10,-4.5,0.5);if(!p)continue;ctx.font=F(UI,0.6*p.s);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=i%2?ACC:'#F4F1FF';ctx.fillText('BRAINROT CUP',p.x,p.y)}
  const top=P(0,-4.5,0);ctx.fillStyle=E.g[0];ctx.fillRect(0,top?top.y:HOR,W,H);
  for(let k=-2;k<12;k++){const y0=k*4.5,y1=Math.min(y0+4.5,CAM.y-0.5);if(y1<=y0)continue;if(k%2===0)quad([[-60,y0],[60,y0],[60,y1],[-60,y1]],E.g[1])}
  drawLinesNet(E)}
function drawLinesNet(E,hq){ctx.strokeStyle=E.line;ctx.lineCap='round';
  const L=pts=>{for(let i=0;i<pts.length-1;i++){const a=P(pts[i][0],pts[i][1]),b=P(pts[i+1][0],pts[i+1][1]);if(!a||!b)continue;ctx.lineWidth=Math.max(1,0.12*(a.s+b.s)/2);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}};
  const seg=(x0,y0,x1,y1)=>{const n=Math.ceil(Math.hypot(x1-x0,y1-y0)/1.5);const a=[];for(let i=0;i<=n;i++)a.push([lerp(x0,x1,i/n),lerp(y0,y1,i/n)]);L(a)};
  seg(-40,0,40,0);seg(-9.16,0,-9.16,5.5);seg(9.16,0,9.16,5.5);seg(-9.16,5.5,9.16,5.5);
  seg(-20.16,0,-20.16,16.5);seg(20.16,0,20.16,16.5);seg(-20.16,16.5,20.16,16.5);
  const arc=[];for(let a=-0.93;a<=0.93;a+=0.08)arc.push([Math.sin(a)*9.15,11+Math.cos(a)*9.15]);L(arc.filter(p=>p[1]>=16.5));
  seg(-40,36,40,36);
  // net
  const b=G.netT>=0?0.9*Math.exp(-G.netT*3.2)*Math.max(0,Math.sin(G.netT*9))+0.2:0, bx=G.netX;
  const bk=(x,z)=>{const dx=x-bx,dz=z-0.6;return -2-b*Math.exp(-(dx*dx+dz*dz)/1.4)};
  ctx.strokeStyle=G.env==='neve'?'rgba(60,70,90,0.45)':'rgba(235,235,245,0.5)';ctx.lineWidth=1;
  for(let i=0;i<=16;i++){const x=-3.66+i*7.32/16;ctx.beginPath();for(let j=0;j<=6;j++){const z=j*2.3/6,p=P(x,bk(x,z),z);if(p)j?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}ctx.stroke()}
  for(let j=0;j<=6;j++){const z=j*2.3/6;ctx.beginPath();for(let i=0;i<=16;i++){const x=-3.66+i*7.32/16,p=P(x,bk(x,z),z);if(p)i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}ctx.stroke()}
  for(let i=0;i<=16;i++){const x=-3.66+i*7.32/16,a=P(x,0,2.44),c=P(x,bk(x,2.3),2.3);if(a&&c){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(c.x,c.y);ctx.stroke()}}
}
function drawPosts(){const a=P(-3.66,0,0),b=P(-3.66,0,2.44),c=P(3.66,0,2.44),d=P(3.66,0,0);if(!a)return;ctx.lineJoin='round';ctx.lineCap='round';
  const hq=typeof HQ==='function'&&HQ();if(hq){ctx.strokeStyle='rgba(0,0,0,0.35)';ctx.lineWidth=0.16*a.s;ctx.beginPath();ctx.moveTo(a.x+0.03*a.s,a.y);ctx.lineTo(b.x+0.03*a.s,b.y+0.03*a.s);ctx.lineTo(c.x+0.03*a.s,c.y+0.03*a.s);ctx.lineTo(d.x+0.03*a.s,d.y);ctx.stroke()}
  ctx.strokeStyle=hq?'#E4E4EC':'#F7F7FA';ctx.lineWidth=0.12*a.s;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.lineTo(d.x,d.y);ctx.stroke();
  if(hq){ctx.strokeStyle='rgba(255,255,255,0.95)';ctx.lineWidth=0.04*a.s;ctx.beginPath();ctx.moveTo(a.x-0.025*a.s,a.y);ctx.lineTo(b.x-0.025*a.s,b.y-0.025*a.s);ctx.lineTo(c.x+0.025*a.s,c.y-0.025*a.s);ctx.lineTo(d.x+0.025*a.s,d.y);ctx.stroke()}}

// ===== characters (original designs) =====
function shadow(p,w){if(typeof HQ==='function'&&HQ()){ctx.save();ctx.translate(p.x,p.y);ctx.scale(1,0.3);const r=w*p.s*1.25,g=ctx.createRadialGradient(0,0,0,0,0,r);g.addColorStop(0,'rgba(0,0,0,0.45)');g.addColorStop(0.6,'rgba(0,0,0,0.22)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,7);CanvasRenderingContext2D.prototype.fill.call(ctx);ctx.restore();return}
  ctx.fillStyle='rgba(0,0,0,0.28)';ctx.beginPath();ctx.ellipse(p.x,p.y,w*p.s,w*0.3*p.s,0,0,7);CanvasRenderingContext2D.prototype.fill.call(ctx)}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}

function legs(s,ph,amp,hip,sp,col,shoe){ctx.strokeStyle=col;ctx.lineWidth=0.09*s;ctx.lineCap='round';

const jacketSleeve=sp=>!sp||sp.style==='none'||sp.style==='colete'||sp.style==='capa'?null:(sp.style==='varsity'?sp.c[1]:sp.c[0]);
function jacketFill(sp,x,y,w,h){const st=sp.style,c0=sp.c[0],c1=sp.c[1];
  if(st==='listrada'){ctx.fillStyle=c0;ctx.fillRect(x,y,w,h);ctx.fillStyle=c1;for(let i=0;i<8;i++)ctx.fillRect(x+i*w/4,y,w/8,h)}
  else if(st==='xadrez'){ctx.fillStyle=c0;ctx.fillRect(x,y,w,h);ctx.fillStyle='rgba(0,0,0,0.28)';const q=w/5;for(let i=0;i<6;i++){ctx.fillRect(x+i*q,y,q*0.45,h);ctx.fillRect(x,y+i*q,w,q*0.45)}}
  else if(st==='camuflada'){ctx.fillStyle=c0;ctx.fillRect(x,y,w,h);ctx.fillStyle=c1;const r=mulberry32(4);for(let i=0;i<10;i++){ctx.beginPath();ctx.ellipse(x+r()*w,y+r()*h,w*0.16,w*0.1,r()*3,0,7);ctx.fill()}}
  else if(st==='cortavento'){ctx.fillStyle=c0;ctx.fillRect(x,y,w,h);ctx.fillStyle=c1;ctx.beginPath();ctx.moveTo(x,y+h*0.35);ctx.lineTo(x+w,y+h*0.15);ctx.lineTo(x+w,y+h*0.45);ctx.lineTo(x,y+h*0.65);ctx.closePath();ctx.fill()}
  else if(st==='puffer'||st==='colete'){ctx.fillStyle=c0;ctx.fillRect(x,y,w,h);ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.lineWidth=Math.max(1,h*0.025);for(let i=1;i<5;i++){ctx.beginPath();ctx.moveTo(x,y+h*i/5);ctx.lineTo(x+w,y+h*i/5);ctx.stroke()}}
  else if(st==='jeans'){ctx.fillStyle=c0;ctx.fillRect(x,y,w,h);ctx.strokeStyle=c1;ctx.setLineDash([h*0.03,h*0.03]);ctx.lineWidth=Math.max(1,h*0.015);ctx.strokeRect(x+w*0.08,y+h*0.12,w*0.84,h*0.3);ctx.setLineDash([])}
  else if(st==='couro'){const g=ctx.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,c0);g.addColorStop(0.45,'rgba(255,255,255,0.25)');g.addColorStop(0.5,c0);g.addColorStop(1,c0);ctx.fillStyle=c0;ctx.fillRect(x,y,w,h);ctx.fillStyle=g;ctx.fillRect(x,y,w,h)}
  else{ctx.fillStyle=c0;ctx.fillRect(x,y,w,h);if(st==='esportiva'||st==='varsity'){ctx.fillStyle=c1;ctx.fillRect(x,y+h*0.9,w,h*0.1)}}}
function drawJacket(s,an,sp,front){if(!sp||sp.style==='none'||sp.style==='capa')return;const st=sp.style,t=an.jt*s,b=an.jb*s,w=an.jw*s,hw=w/2;ctx.save();
  const panel=(x0,x1)=>{ctx.save();ctx.beginPath();ctx.roundRect(x0,t,x1-x0,b-t,s*0.06);ctx.clip();jacketFill(sp,-hw,t,w,b-t);ctx.restore();ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=Math.max(1,s*0.015);ctx.beginPath();ctx.roundRect(x0,t,x1-x0,b-t,s*0.06);ctx.stroke()};
  if(st==='neon'){ctx.shadowColor=sp.c[0];ctx.shadowBlur=s*0.12}
  if(front&&st!=='moletom'){const gap=st==='smoking'?w*0.17:w*0.13;
    if(st==='smoking'){ctx.fillStyle=sp.c[1];ctx.fillRect(-gap,t,gap*2,b-t)}
    panel(-hw,-gap);panel(gap,hw);ctx.shadowBlur=0;
    ctx.fillStyle='rgba(0,0,0,0.18)';for(const k of[-1,1]){ctx.beginPath();ctx.moveTo(k*gap,t);ctx.lineTo(k*(gap+w*0.14),t);ctx.lineTo(k*gap,t+(b-t)*0.35);ctx.closePath();ctx.fill()}
    if(st==='smoking'){ctx.fillStyle='#1E1D24';ctx.beginPath();ctx.moveTo(0,t+s*0.06);ctx.lineTo(-s*0.07,t+s*0.02);ctx.lineTo(-s*0.07,t+s*0.1);ctx.closePath();ctx.moveTo(0,t+s*0.06);ctx.lineTo(s*0.07,t+s*0.02);ctx.lineTo(s*0.07,t+s*0.1);ctx.closePath();ctx.fill()}
    if(st==='couro'||st==='esportiva'){ctx.strokeStyle='#C9CED7';ctx.lineWidth=Math.max(1,s*0.012);for(const k of[-1,1]){ctx.beginPath();ctx.moveTo(k*gap,t);ctx.lineTo(k*gap,b);ctx.stroke()}}}
  else{panel(-hw,hw);ctx.shadowBlur=0;
    if(st==='moletom'){ctx.fillStyle='rgba(0,0,0,0.18)';if(front){ctx.beginPath();ctx.roundRect(-hw*0.55,t+(b-t)*0.55,hw*1.1,(b-t)*0.3,s*0.04);ctx.fill();ctx.strokeStyle='#F4F4F8';ctx.lineWidth=Math.max(1,s*0.012);ctx.beginPath();ctx.moveTo(-s*0.05,t);ctx.lineTo(-s*0.05,t+s*0.14);ctx.moveTo(s*0.05,t);ctx.lineTo(s*0.05,t+s*0.14);ctx.stroke()}
      else{ctx.fillStyle=sp.c[0];ctx.beginPath();ctx.ellipse(0,t+s*0.02,hw*0.8,s*0.16,0,Math.PI,0);ctx.fill();ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.stroke()}}
    if(st==='varsity'&&!front){ctx.fillStyle=sp.c[1];ctx.font=F(DISP,s*0.2);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('G',0,(t+b)/2)}}
  ctx.restore()}
function drawCape(s,an,sp,behind){if(!sp||sp.style!=='capa')return;const t=an.jt*s,b=0.15*s,w=an.jw*s*1.25,sw=Math.sin(G.t*5)*s*0.05;ctx.save();
  ctx.fillStyle=behind?sp.c[1]:sp.c[0];ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=Math.max(1,s*0.015);ctx.beginPath();ctx.moveTo(-w*0.45,t);ctx.lineTo(w*0.45,t);ctx.quadraticCurveTo(w*0.7+sw,(t+b)/2,w*0.6+sw,b);
  for(let i=0;i<4;i++)ctx.quadraticCurveTo(w*(0.45-i*0.3)+sw,b+s*0.06,w*(0.3-i*0.3)+sw,b);ctx.quadraticCurveTo(-w*0.7+sw,(t+b)/2,-w*0.45,t);ctx.fill();ctx.stroke();
  if(!behind){ctx.fillStyle=sp.c[1];ctx.beginPath();ctx.arc(0,t+s*0.25,s*0.09,0,7);ctx.fill()}ctx.restore()}

const ONLINE_BLOCKED='O online não abre aqui. Use o link do GitHub (ramosbernardo.github.io/golazzo).';

  {const b={x,y,w:bw,h:bh*1.15};if(abuseOn()){const l=Math.ceil((SAVE.abuse.until-Date.now())/60000);pill(b,`ENCERRAR ADMIN ABUSE (${l} min)`,false,()=>abuseStop())}else{ctx.fillStyle='#F5C542';rrect(b.x,b.y,b.w,b.h,b.h/2);ctx.fill();ctx.font=F(DISP,b.h*0.42);ctx.fillStyle=INK;ctx.textAlign='center';ctx.textBaseline='middle';const nx=ABUSE_ORDER.find(id=>!((SAVE.abuse&&SAVE.abuse.list)||[]).includes(id));ctx.fillText('⚡ ADMIN ABUSE'+(nx?' · LANÇAR #'+(ABUSE_ORDER.indexOf(nx)+1):''),b.x+b.w/2,b.y+b.h/2,b.w*0.92);hit(b,()=>abuseStart())}y+=b.h+gap}

  y+=Math.ceil(i/cols)*(bh+gap)+u*0.02;ctx.font=F(UI,u*0.026);ctx.fillStyle='rgba(255,255,255,0.65)';ctx.textAlign='left';ctx.textBaseline='top';

 {id:'duelista',n:'DUELISTA',d:'Vença 5 duelos online',r:'raro',ok:()=>stv('duelWin')>=5},

 {id:'recordista',n:'RECORDISTA',d:'10 mil pontos no Jogo Livre',r:'epico',ok:()=>MODES.some(m=>bestOf(m.id)>=10000)},
 {id:'viciado',n:'VICIADO',d:'Abra 7 baús do dia',r:'raro',ok:()=>stv('chest')>=7},
 {id:'cacador',n:'CAÇADOR DE DESAFIOS',d:'Resgate 30 desafios',r:'epico',ok:()=>stv('daily')>=30},
 {id:'dono',n:'DONO DO JOGO',d:'Exclusivo do ADM',r:'adm',adm:true,ok:()=>isAdm()}];

function stAdd(k,n=1){SAVE.st=SAVE.st||{};SAVE.st[k]=(SAVE.st[k]||0)+n}
function titleHas(t){return t.adm?isAdm():(isAdm()||(SAVE.titles||[]).includes(t.id))}
function checkTitles(silent){SAVE.titles=SAVE.titles||[];let got=null;for(const t of TITLES){if(t.adm||SAVE.titles.includes(t.id))continue;if(t.ok()){SAVE.titles.push(t.id);got=t}}
  if(got){saveGame();if(!silent){toast('NOVO TÍTULO: '+got.n);SFX.coin&&SFX.coin()}}}
function myTitle(){const t=TITLES.find(t=>t.id===SAVE.title);return t&&titleHas(t)?t:null}
const myTitleName=()=>{const t=myTitle();return t?t.n:''};
function titleTag(txt,x,y,size,col,align='left'){if(!txt)return 0;ctx.font=F(UI,size);const w=ctx.measureText(txt).width+size*0.9,h=size*1.5,bx=align==='right'?x-w:align==='center'?x-w/2:x;
  ctx.fillStyle='rgba(0,0,0,0.35)';rrect(bx,y-h/2,w,h,h/2);ctx.fill();ctx.strokeStyle=col||'#F5C542';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle=col||'#F5C542';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,bx+w/2,y+size*0.05);return w}
function drawTitles(){panel(0.9);const u=Math.min(W,H),x=W*(PORTRAIT?0.06:0.08);let y=H*(PORTRAIT?0.05:0.04);const ts=title('TÍTULOS',x,y,u*0.085);y+=ts*1.2;
  const have=TITLES.filter(titleHas).length,tot=TITLES.filter(t=>!t.adm||isAdm()).length;
  ctx.font=F(UI,u*0.028);ctx.fillStyle='rgba(255,255,255,0.7)';ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(`${have} de ${tot} conquistados · toque para usar`,x,y,W-x*2);y+=u*0.05;
  const list=TITLES.filter(t=>!t.adm||isAdm()),cols=PORTRAIT?2:4,gap=u*0.014,cw=(W-x*2-gap*(cols-1))/cols,rows=Math.ceil(list.length/cols),bh=Math.min(u*0.11,(H-y-u*0.16-gap*rows)/rows);
  list.forEach((t,i)=>{const bx=x+(i%cols)*(cw+gap),by=y+Math.floor(i/cols)*(bh+gap),has=titleHas(t),eq=SAVE.title===t.id,col=TRAR[t.r];

// ===== ADMIN ABUSE (evento) =====
const ABUSE_MS=10*60*1000;
const abuseOn=()=>!!(SAVE.abuse&&SAVE.abuse.until>Date.now());
function abuseStart(){SAVE.abuse=SAVE.abuse||{n:0,list:[],until:0};const A=SAVE.abuse;let nc=null;
  const nx=ABUSE_ORDER.find(id=>!A.list.includes(id));if(nx){A.list.push(nx);nc=nx}A.n=(A.n||0)+1;A.until=Date.now()+ABUSE_MS;saveGame();
  G.abuseFx={t:0,ch:nc,from:''};G.cheer=1;SFX.goal();narrate('Admin abuse!','en');vib([60,40,60,40,120]);setState('menu')}
function abuseStop(){if(SAVE.abuse){SAVE.abuse.until=0;saveGame()}toast('Admin Abuse encerrado')}
function abuseGoal(){if(!abuseOn())return;if(G.game==='duel'&&G.duel&&G.duel.mode==='online'&&duelMe()!==duelKicker()&&!isAtk())return;addCoins(100);pop('+100 ADMIN ABUSE',0,3)}
function abuseSync(){if(abuseOn()&&G.duel&&G.duel.mode==='online')try{NET.send({t:'abuse',list:SAVE.abuse.list,left:SAVE.abuse.until-Date.now()})}catch(e){}}
function abuseRecv(m){SAVE.abuse=SAVE.abuse||{n:0,list:[],until:0};const A=SAVE.abuse;let nc=null;for(const id of (m.list||[]))if(ABUSE_ORDER.includes(id)&&!A.list.includes(id)){A.list.push(id);nc=id}
  A.until=Math.max(A.until||0,Date.now()+Math.min(ABUSE_MS,Math.max(0,+m.left||0)));saveGame();G.abuseFx={t:0,ch:nc,from:'SEU AMIGO ADM'};SFX.goal()}
function drawAbuseBanner(){if(!abuseOn()||G.abuseFx||!['play','goal','lost','menu','pause'].includes(G.state))return;const u=Math.min(W,H),left=Math.ceil((SAVE.abuse.until-Date.now())/1000),mm=Math.floor(left/60),ss=String(left%60).padStart(2,'0');
  const txt=`⚡ ADMIN ABUSE · ${mm}:${ss} · +100 POR GOL`;ctx.font=F(UI,u*0.026);const w=ctx.measureText(txt).width+u*0.05,h=u*0.048,x=W/2-w/2,y=G.toast?u*0.075:u*0.012;
  const pulse=0.75+0.25*Math.sin(G.t*6);ctx.fillStyle=`rgba(245,197,66,${pulse})`;rrect(x,y,w,h,h/2);ctx.fill();ctx.fillStyle=INK;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,W/2,y+h/2)}
function drawAbuseFx(){const f=G.abuseFx;if(!f)return;f.t+=1/60;const u=Math.min(W,H),T=f.t;if(T>6.5){G.abuseFx=null;return}
  const a=Math.min(1,T*3,(6.5-T)*2);ctx.save();ctx.globalAlpha=a;ctx.fillStyle='rgba(8,6,14,0.96)';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(W/2,H*0.45);ctx.rotate(T*0.6);for(let i=0;i<16;i++){ctx.rotate(Math.PI/8);ctx.fillStyle=i%2?'rgba(245,197,66,0.16)':'rgba(255,61,127,0.13)';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-u*0.12,-Math.max(W,H));ctx.lineTo(u*0.12,-Math.max(W,H));ctx.fill()}ctx.restore();
  if(Math.random()<0.5)FX.push({k:'conf',x:(Math.random()-0.5)*8,y:PL.y-3,z:5,vx:(Math.random()-0.5)*4,vy:0,vz:2,rot:0,life:2,c:Math.random()});
  const k=Math.min(1,T*2.5),sc=1+0.4*(1-k)+0.04*Math.sin(T*10);ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.save();ctx.translate(W/2,H*0.14);ctx.scale(sc,sc);ctx.rotate(-0.05);ctx.font=F(DISP,Math.min(u*0.15,W*0.13));ctx.lineWidth=u*0.02;ctx.strokeStyle=INK;ctx.lineJoin='round';ctx.strokeText('ADMIN ABUSE!',0,0);ctx.fillStyle='#F5C542';ctx.fillText('ADMIN ABUSE!',0,0);ctx.restore();
  ctx.font=F(UI,u*0.034);ctx.fillStyle='#fff';ctx.fillText(f.from?f.from+' ATIVOU O EVENTO':'+100 MOEDAS POR GOL POR 10 MINUTOS',W/2,H*0.22,W*0.92);
  const c=f.ch&&CHARS.find(x=>x.id===f.ch);
  if(c&&T>1.1){const r=Math.min(1,(T-1.1)*2.2),hs=u*0.2*(0.6+0.4*back(r));ctx.font=F(UI,u*0.036);ctx.fillStyle=ACC;ctx.fillText('NOVO PERSONAGEM LANÇADO!',W/2,H*0.3);
    ctx.fillStyle='rgba(245,197,66,0.25)';ctx.beginPath();ctx.ellipse(W/2,H*0.66,hs*0.9,hs*0.22,0,0,7);ctx.fill();
    drawHero({x:W/2,y:H*0.66,s:hs},{phase:T*5,amp:0.2,front:true,armsUp:0.7+0.3*Math.sin(T*6),z:Math.abs(Math.sin(T*4))*0.15},c);
    ctx.font=F(DISP,u*0.08);ctx.lineWidth=u*0.012;ctx.strokeStyle=INK;ctx.strokeText(c.name,W/2,H*0.74,W*0.94);ctx.fillStyle='#fff';ctx.fillText(c.name,W/2,H*0.74,W*0.94);
    ctx.font=F(UI6,u*0.03);ctx.fillStyle='rgba(255,255,255,0.85)';ctx.fillText(c.perk,W/2,H*0.79,W*0.9);ctx.fillText('Já está na escolha de craques!',W/2,H*0.83,W*0.9)}
  else if(!c&&T>1.1){ctx.font=F(UI,u*0.032);ctx.fillStyle='rgba(255,255,255,0.85)';ctx.fillText('Todos os personagens já foram lançados!',W/2,H*0.5,W*0.9)}
  ctx.restore();hit({x:0,y:0,w:W,h:H},()=>{if(f.t>1.5)G.abuseFx=null})}
